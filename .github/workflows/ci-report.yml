name: CI Report

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: ci-report-${{ github.repository }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Post PR CI Report
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    uses: use-nyte/.github/.github/workflows/ci-report.yml@v1.1.1
