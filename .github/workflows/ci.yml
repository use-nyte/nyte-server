name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Node CI
    uses: use-nyte/.github/.github/workflows/ci-node.yml@v1.1.0
    with:
      run-build: true
      run-tests: true
      run-typecheck: true
      run-lint: true
      run-format: true
      run-docs: true

  nightly:
    name: Request nightly images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Generate Nyte Automation token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NYTE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.NYTE_AUTOMATION_PRIVATE_KEY }}
          owner: use-nyte
          repositories: nyte
          permission-contents: write

      - name: Notify packaging
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method POST repos/use-nyte/nyte/dispatches -f event_type=component-main-updated
