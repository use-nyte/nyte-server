name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Node CI
    uses: use-nyte/.github/.github/workflows/ci-node.yml@v1.2.0
    with:
      run-build: true
      run-tests: true
      run-typecheck: true
      run-lint: true
      run-format: true
      run-docs: true

  nightly:
    name: Request nightly images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    uses: use-nyte/.github/.github/workflows/dispatch-automation.yml@v1.2.0
    with:
      event: component-main-updated
    secrets:
      NYTE_AUTOMATION_PRIVATE_KEY: ${{ secrets.NYTE_AUTOMATION_PRIVATE_KEY }}
