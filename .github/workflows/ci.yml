name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Node CI
    uses: use-nyte/.github/.github/workflows/ci-node.yml@v1.1.0
    with:
      run-build: true
      run-tests: true
      run-typecheck: true
      run-lint: true
      run-format: true
      run-docs: true
